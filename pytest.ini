[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Fast unit tests
    integration: Integration tests with DB and APIs
    celery: Celery background worker tests
    sockets: Realtime WebSockets tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
