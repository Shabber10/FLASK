name: Enterprise Flask CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'feature/**'
      - 'feature/*'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flaskuser
          POSTGRES_PASSWORD: flaskpassword
          POSTGRES_DB: flaskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint Codebase with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 capstone tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all style warnings without breaking build
          flake8 capstone tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Automated Test Suite with Coverage
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest -v --cov=capstone --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-flask-capstone:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
