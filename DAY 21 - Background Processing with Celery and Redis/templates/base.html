<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Day 21 Celery Background Tasks{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f5; margin: 40px; color: #333; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; margin-top: 0; }
        .badge { background: #d35400; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .btn { display: inline-block; background: #2980b9; color: white; padding: 10px 18px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-right: 10px; border: none; cursor: pointer; }
        .btn-success { background: #27ae60; }
        .btn:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #e9ecef; text-align: left; }
        th { background: #34495e; color: white; }
        code { background: #f8f9fa; padding: 2px 6px; border-radius: 3px; color: #c7254e; font-weight: bold; font-family: monospace; }
        ul { line-height: 1.6; }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="card">
        <h2>⚙️ Background Task Queue & Celery Engine (Day 21)</h2>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
